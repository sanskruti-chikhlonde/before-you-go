<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before-you-go</title>
     
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>
      
    <header>
         
        <div class="site-logo">
        <img src="./assets/BYG-logo.png" alt="Before You Go logo">

    <div class="logo-text">
        <h1>Before You Go</h1>
        <p>Pack right. Go light.</p>
        
        </div>
    </div>
        <!-- THEME TOGGLE -->
        <button type="button" id="theme-toggle" aria-label="Toggle theme">
          ☀️
        </button> 

    </header>

    <!-- TRIP PLANNER -->
    <main>

        <section class="trip-planner">
            <h2>Plan Your Trip</h2>

            <form id="trip-form">

                <div class="form-group">
                    <label for="destination">
                       <i class="fa-solid fa-location-dot"> </i>
                       Destination
                    </label>
                    <input
                        type="text"
                        id="destination"
                        placeholder="Where are you going?"
                    >
                </div>

                <div class="form-group">
                    <label for="days">
                    <i class="fa-solid fa-calendar-days"></i>
                    Number of Days
                    </label>
                    <input
                        type="number"
                        id="days"
                        min="1"
                        placeholder="e.g. 4"
                    >
                </div>

                <div class="form-group">
                    <label>
                     <i class="fa-solid fa-cloud-sun"></i>
                     Weather
                    </label>

                    <label class="weather-option">
                        <input type="radio" name="weather" value="sunny">
                        Sunny
                    </label>

                    <label class="weather-option">
                        <input type="radio" name="weather" value="rainy">
                        Rainy  
                    </label>

                    <label class="weather-option">
                        <input type="radio" name="weather" value="cold">
                        Cold
                    </label>
                </div>

                 <!-- ACTIVITIES -->
                <div class="form-group">
                    <label>
                    <i class="fa-solid fa-compass"></i>
                    Activities
                    </label>

                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="beach"> Beach & Swimming
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="sightseeing"> Sightseeing
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="party"> Party & Clubbing
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="nightlife"> Nightlife
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="dining"> Dining
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="business"> Business
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="hiking"> Hiking & Trekking
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="camping"> Camping
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="culture"> Culture & Heritage
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="shopping"> Shopping
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="wellness"> Wellness & Relaxation
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="adventure"> Adventure & Sports
                    </label>
                    <label class="activity-option">
                        <input type="checkbox" name="activity" value="roadtrip"> Road Trip
                    </label>
                </div>

                <!-- GENERATE BUTTON -->
                <button type="submit">Generate Packing List</button>

            </form>
        </section>

    <!-- TRIP SUMMARY -->
    <section class="trip-summary">

        <div class="summary-heading">
            <span>Trip Summary</span>
        </div>

        <h2 id="summary-destination">-</h2>

        <div class="summary-details">
            
            <div class="summary-item">
                <span class="summary-label">Duration</span>
                <span id="summary-days">-</span>
            </div>

            <div class="summary-item">
                <span class="summary-label">Weather</span>
                <span id="summary-weather">-</span>
            </div>

            <div class="summary-item">
                <span class="summary-label">Activities</span>
                <span id="summary-activities">-</span>
            </div>

        </div>

    </section>

    <!-- PACKING DASHBOARD-->
     <section class="packing-dashboard">

    <!-- PACKING HEADER -->
    <div class="packing-header">
    <div>
        <h2>
        <i class="fa-solid fa-suitcase-rolling"></i>
        My Packing List
        </h2>
        <p class="packing-subtitle">The right pack for your plan.</p>
    </div>

        <button type="button" id="add-item-button">+ Add Item</button>
    </div>

    <!-- ADD-ITEM FORM -->
    <form id="add-item-form"> 
    <input 
        type="text" 
        id="add-item-input" 
        placeholder="Enter item name...">

    <select id="add-item-category">
        <option value="activity">Activity Items</option>
        <option value="outfits">Outfits</option>
        <option value="footwear">Footwear</option>
        <option value="weather">Weather Essentials</option>
        <option value="travel">Travel Essentials</option>
        <option value="electronics">Electronics</option>
    </select>

    <button type="submit">Add</button> 
    </form>

        <!-- PACKING PROGRESS-->
        <div class="packing-progress">
            <div class="packing-text">
                <span id="progress-text">0 / 0 item packed</span>
                <span id="progress-percentage">0%</span>
            </div>

            <div class=" progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>

        <!-- PACKING LIST -->
         <div id="packing-list">

            <div class="packing-category">
            <h3>
                <i class="fa-solid fa-shirt"></i>
                Outfits
            </h3>
                <div id="outfits-list"></div>
            </div>
            
            <!-- FOOTWEAR-->
            <div class="packing-category">
            <h3>
                <i class="fa-solid fa-shoe-prints"></i>
                Footwear
            </h3>
                <div id="footwear-list"></div>
            </div>

            <!-- WEATHER ESSENTIALS-->
            <div class="packing-category">
            <h3>
                 <i class="fa-solid fa-cloud-sun"></i>
                 Weather Essentials
            </h3>
                <div id="weather-list"></div>
            </div>

            <!--TRAVEL ESSENTIALS -->
            <div class="packing-category">
            <h3>
                <i class="fa-solid fa-passport"></i>
                Travel Essentials
            </h3>
                <div id="travel-list"></div>
            </div>

            <!-- ELECTRONICS-->
            <div class="packing-category">
            <h3>
                <i class="fa-solid fa-mobile-screen-button"></i>
                Electronics
            </h3>
                <div id="electronics-list"></div>
            </div>

            <!--ACTIVITY ITEMS-->
            <div class="packing-category">
            <h3>
                <i class="fa-solid fa-person-hiking"></i>
                Activity Items
            </h3>
                <div id="activity-list"></div>
            </div>

         </div>

    </section>

    <!-- RESET TRIP-->
    <section class="reset-trip">

        <button type="button" id="reset-trip">
            Reset Trip
        </button>

    </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
