<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before-you-go</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
      
    <header>
        <h1>Before You Go</h1>
        <p>Pack right. Go light.</p>

        <!-- THEME TOGGLE -->
        <button type="button" id="theme-toggle">
           🌙 Dark Mode
        </button>  

    </header>

    <!-- TRIP PLANNER -->
    <main>

        <section class="trip-planner">
            <h2>Plan Your Trip</h2>

            <form id="trip-form">

                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input
                        type="text"
                        id="destination"
                        placeholder="Where are you going?"
                    >
                </div>

                <div class="form-group">
                    <label for="days">Number of Days</label>
                    <input
                        type="number"
                        id="days"
                        min="1"
                        placeholder="e.g. 4"
                    >
                </div>

                <div class="form-group">
                    <label>Weather</label>

                    <label>
                        <input type="radio" name="weather" value="sunny">
                        Sunny
                    </label>

                    <label>
                        <input type="radio" name="weather" value="rainy">
                        Rainy
                    </label>

                    <label>
                        <input type="radio" name="weather" value="cold">
                        Cold
                    </label>
                </div>

                 <!-- ACTIVITIES -->
                <div class="form-group">
                    <label>Activities</label>

                    <label><input type="checkbox" name="activity" value="beach"> Beach & Swimming</label>
                    <label><input type="checkbox" name="activity" value="sightseeing"> Sightseeing</label>
                    <label><input type="checkbox" name="activity" value="party"> Party & Clubbing</label>
                    <label><input type="checkbox" name="activity" value="nightlife"> Nightlife</label>
                    <label><input type="checkbox" name="activity" value="dining"> Dining</label>
                    <label><input type="checkbox" name="activity" value="business"> Business</label>
                    <label><input type="checkbox" name="activity" value="hiking"> Hiking & Trekking</label>
                    <label><input type="checkbox" name="activity" value="camping"> Camping</label>
                    <label><input type="checkbox" name="activity" value="culture"> Culture & Heritage</label>
                    <label><input type="checkbox" name="activity" value="shopping"> Shopping</label>
                    <label><input type="checkbox" name="activity" value="wellness"> Wellness & Relaxation</label>
                    <label><input type="checkbox" name="activity" value="adventure"> Adventure & Sports</label>
                    <label><input type="checkbox" name="activity" value="roadtrip"> Road Trip</label>
                </div>

                <!-- GENERATE BUTTON -->
                <button type="submit">Generate Packing List</button>

            </form>
        </section>

    <!-- TRIP SUMMARY -->
     <section class="trip-summary">

        <h2>Your Trip</h2>

        <div>
            <span>Destination:</span>
            <span id="summary-destination">-</span>
        </div>
        
        <div>
            <span>Duration:</span>
            <span id="summary-days">-</span>
        </div>

        <div>
            <span>Weather:</span>
            <span id="summary-weather">-</span>
        </div>

        <div>
            <span>Activities:</span>
            <span id="summary-activities">-</span>
        </div>

    </section>

    <!-- PACKING DASHBOARD-->
     <section class="packing-dashboard">

        <h2>My Packing List</h2>
        <p>The right pack for your plan.</p>

        <!-- PACKING PROGRESS-->
        <div class="packing-progress">
            <span id="progress-text">0 / 0 item packed</span>
            <span id="progress-percentage">0%</span>
        </div>

        <!-- PACKING LIST -->
         <div id="packing-list">

            <div class="packing-category">
                <h3>Outfits</h3>
                <div id="outfits-list"></div>
            </div>
            
            <!-- FOOTWEAR-->
            <div class="packing-category">
                <h3>Footwear</h3>
                <div id="footwear-list"></div>
            </div>

            <!-- WEATHER ESSENTIALS-->
            <div class="packing-category">
                <h3>Weather Essentials</h3>
                <div id="weather-list"></div>
            </div>

            <!--TRAVEL ESSENTIALS -->
            <div class="packing-category">
                <h3>Travel Essentials</h3>
                <div id="travel-list"></div>
            </div>

            <!-- ELECTRONICS-->
            <div class="packing-category">
                <h3>Electronics</h3>
                <div id="electronics-list"></div>
            </div>

            <!--ACTIVITY ITEMS-->
            <div class="packing-category">
                <h3>Activity-Items</h3>
                <div id="activity-list"></div>
            </div>

         </div>

    </section>

    <!-- CUSTOM ITEM-->
    <section class="custom-item">

        <h2>Add Your Own Item</h2>

        <!--CUSTOM ITEM FORM-->
        <form id="custom-item-form">
            <input
               type="text"
               id="custom-item-input"
               placeholder="e.g. Travel pillow">

            <button type="submit">Add Item</button>
        </form>

    </section>

    <!-- RESET TRIP-->
    <section class="reset-trip">

        <button type="button" id="reset-trip">
            Reset Trip
        </button>

    </section>


    </main>

</body>
</html>
