<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before-you-go</title>
</head>
<body>
    <header>
        <h1>Before You Go</h1>
        <p>Pack right. Go light.</p>
    </header>

    <!-- TRIP PLANNER -->
    <main>

        <section class="trip-planner">
            <h2>Plan Your Trip</h2>

            <form id="trip-form">

                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input
                        type="text"
                        id="destination"
                        placeholder="Where are you going?"
                    >
                </div>

                <div class="form-group">
                    <label for="days">Number of Days</label>
                    <input
                        type="number"
                        id="days"
                        min="1"
                        placeholder="e.g. 4"
                    >
                </div>

                <div class="form-group">
                    <label>Weather</label>

                    <label>
                        <input type="radio" name="weather" value="sunny">
                        Sunny
                    </label>

                    <label>
                        <input type="radio" name="weather" value="rainy">
                        Rainy
                    </label>

                    <label>
                        <input type="radio" name="weather" value="cold">
                        Cold
                    </label>
                </div>

                 <!-- ACTIVITIES -->
                <div class="form-group">
                    <label>Activities</label>

                    <label><input type="checkbox" name="activity" value="beach"> Beach & Swimming</label>
                    <label><input type="checkbox" name="activity" value="sightseeing"> Sightseeing</label>
                    <label><input type="checkbox" name="activity" value="party"> Party & Clubbing</label>
                    <label><input type="checkbox" name="activity" value="nightlife"> Nightlife</label>
                    <label><input type="checkbox" name="activity" value="dining"> Dining</label>
                    <label><input type="checkbox" name="activity" value="business"> Business</label>
                    <label><input type="checkbox" name="activity" value="hiking"> Hiking & Trekking</label>
                    <label><input type="checkbox" name="activity" value="camping"> Camping</label>
                    <label><input type="checkbox" name="activity" value="culture"> Culture & Heritage</label>
                    <label><input type="checkbox" name="activity" value="shopping"> Shopping</label>
                    <label><input type="checkbox" name="activity" value="wellness"> Wellness & Relaxation</label>
                    <label><input type="checkbox" name="activity" value="adventure"> Adventure & Sports</label>
                    <label><input type="checkbox" name="activity" value="roadtrip"> Road Trip</label>
                </div>

                <!-- GENERATE BUTTON -->
                <button type="submit">Generate Packing List</button>

            </form>
        </section>
    <!-- TRIP SUMMARY -->
     <section class="trip-summary">

        <h2>Your Trip</h2>

        <div>
            <span>Destination:</span>
            <span id="summary-destination">-</span>
        </div>

        <div>
            <span>Weather:</span>
            <span id="summary-weather">-</span>
        </div>

        <div>
            <span>Activities:</span>
            <span id="summary-activities">-</span>
        </div>

     </section>
     
    </main>

</body>
</html>
